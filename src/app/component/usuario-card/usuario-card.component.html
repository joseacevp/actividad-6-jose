<!-- 12 dibujado de la tarjeta de usuario -->
<article class="card h-100 border-secondary-subtle shadow-sm">
  <div class="card-body d-flex flex-column align-items-center text-center p-3">
    <img
      class="rounded-circle border border-3 border-primary object-fit-cover mb-3"
      [src]="usuario().image"
      [alt]="usuario().first_name + ' ' + usuario().last_name"
      width="112"
      height="112"
    />

    <h3 class="card-title fs-6 fw-semibold mb-3">
      {{ usuario().first_name }} {{ usuario().last_name }}
    </h3>

    <div class="d-flex justify-content-center gap-2 mt-auto w-100">
      <!-- 13 envia a detalle de usuario -->
      <a
        class="btn btn-outline-secondary btn-sm"
        [routerLink]="['/dashboard/detalle', usuario()._id]"
      >
        Ver detalle
      </a>
      <!-- 14 envia a actualizar usuario -->
      <a
        class="btn btn-outline-primary btn-sm"
        [routerLink]="['/dashboard/update-usuario', usuario()._id]"
      >
        Actualizar
      </a>
      <!-- 15 boton con la funcion de borrar usuario, que se implementara en el componente padre -->
      <button class="btn btn-outline-danger btn-sm" type="button" (click)="borrarUsuario()">Borrar</button>
    </div>
  </div>
</article>
