<section>
  <h2>Usuarios</h2>
  <!-- 9 vista de la lista de usuarios con signals -->
  @if (cargando()) {
    <p>Cargando usuarios...</p>
  } @else if (error()) {
    <p role="alert">{{ error() }}</p>
  } @else {
    <div>
      @for (usuario of usuarioList(); track usuario._id) {
        <article>
          <!-- 10 pasamos el input de usuario al componente hijo -->
          <app-usuario-card [usuario]="usuario"></app-usuario-card>
        </article>
      }
    </div>
  }
</section>
