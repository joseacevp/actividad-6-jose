<!-- 1 formulario signal
detectar si es nuevo o es para actualizar, y mostrar el formulario con los datos del usuario a actualizar
e

-->

<section class="py-2">
  <!-- 3 formulario cambia el titulo si recibe id o no  -->
  <h1 class="h3 text-uppercase fw-normal mb-4">{{ title() }}</h1>

  <!-- 4 formulario evento submit para recibir los datos del formulario y los envia al ts-->
  <form class="row g-4" novalidate (submit)="getDataForm($event)">
    <div class="col-12">
      <label class="form-label" for="firstName">Nombre Usuario</label>
      <input
        class="form-control"
        id="firstName"
        type="text"
        /* 5 formulario recibe le dato y lo almacena en formField
        conectamos cada input con su propiedad en el objeto */
        [formField]="usuarioFields.first_name"
        placeholder="Introduce nombre de usuario"
      />
    </div>

    <div class="col-12">
      <label class="form-label" for="lastName">Apellido Usuario</label>
      <input
        class="form-control"
        id="lastName"
        type="text"
        [formField]="usuarioFields.last_name"
        placeholder="Introduce apellido de usuario"
      />
    </div>

    <div class="col-12">
      <label class="form-label" for="email">Email Usuario</label>
      <input
        class="form-control"
        id="email"
        type="email"
        [formField]="usuarioFields.email"
        placeholder="Introduce email del usuario"
      />
    </div>

    <div class="col-12">
      <label class="form-label" for="image">Imagen Usuario</label>
      <input
        class="form-control"
        id="image"
        type="url"
        [formField]="usuarioFields.image"
        placeholder="Introduce url de foto usuario"
      />
    </div>

    <div class="col-12">
      <button class="btn btn-outline-secondary px-4" type="submit" [disabled]="guardando()">
        {{ guardando() ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>

    @if (error()) {
      <div class="col-12">
        <p class="alert alert-danger mb-0" role="alert">{{ error() }}</p>
      </div>
    }
  </form>
</section>
